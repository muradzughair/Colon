    <style>
@import url("https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;650;700;750&family=IBM+Plex+Mono:wght@400;500;600&display=swap");

:root {
  color-scheme: dark;
  --plum: #2E1422;
  --coral: #FF7E6B;
  --rose: #FF5E7E;
  --salmon: #FA8072;
  --wine: #7D1D34;
  --ink: #FFF2EC;
  --muted: #D4BFC4;
  --faint: #A68A94;
  --line: rgba(255, 231, 224, .15);
  --glass: rgba(46, 20, 34, .88);
  --display-font: "Archivo", sans-serif;
  --mono-font: "IBM Plex Mono", monospace;
  --ease: cubic-bezier(.2,.72,.2,1);
  --fit-scale: 1;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  min-height: 100%;
  margin: 0;
  overflow: clip;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  background: var(--plum);
  color: var(--ink);
  font-family: var(--display-font);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button { color: inherit; }

/* A fixed, editorial stage: copy occupies the left half, anatomy remains alive to the right. */
.presentation {
  --scene-center-x: .79;
  --scene-center-y: .50;
  --scene-height: .70;
  position: fixed;
  inset: 0;
  isolation: isolate;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  overflow: clip;
  background:
    radial-gradient(ellipse at 83% 47%, rgba(125,29,52,.28), transparent 42%),
    var(--plum);
}
.presentation::after {
  position: absolute;
  z-index: 10;
  inset: 0;
  content: "";
  opacity: .035;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
  mix-blend-mode: screen;
}
.ambient { position: absolute; z-index: 0; pointer-events: none; }
.ambient-left {
  inset: 0;
  background:
    radial-gradient(ellipse at 0% 100%, rgba(255,126,107,.13), transparent 38%),
    radial-gradient(ellipse at 96% 4%, rgba(255,94,126,.08), transparent 36%);
}
.ambient-stage {
  top: calc(var(--scene-center-y, .5) * 100%);
  left: calc(var(--scene-center-x, .75) * 100%);
  width: auto;
  height: calc(var(--scene-height, .72) * 100dvh);
  aspect-ratio: 1;
  border: 1px solid rgba(255,126,107,.11);
  border-radius: 50%;
  box-shadow: 0 0 0 44px rgba(255,126,107,.018), 0 0 0 88px rgba(255,126,107,.01);
  transform: translate(-50%,-50%);
}
.model-shadow, .model-halo {
  position: absolute;
  z-index: 1;
  top: calc(var(--scene-center-y, .5) * 100%);
  left: calc(var(--scene-center-x, .75) * 100%);
  pointer-events: none;
  transform: translate(-50%,-50%);
}
.model-shadow {
  width: min(30vw, 480px);
  height: clamp(22px,5vw,60px);
  border-radius: 50%;
  background: rgba(14,4,10,.48);
  filter: blur(34px);
}
.model-halo {
  width: min(61vw, calc(var(--scene-height, .72) * 100dvh));
  aspect-ratio: 1;
  border: 1px solid rgba(255,126,107,.13);
  border-radius: 50%;
  box-shadow: inset 0 0 90px rgba(255,126,107,.035);
}
.model-halo::before, .model-halo::after {
  position: absolute;
  inset: 8%;
  content: "";
  border: 1px solid rgba(255,126,107,.07);
  border-radius: inherit;
}
.model-halo::after { inset: 17%; border-color: rgba(255,94,126,.08); }
#model-view {
  position: absolute;
  z-index: 2;
  inset: 0;
  touch-action: none;
  cursor: grab;
}
#model-view:active { cursor: grabbing; }
#model-view canvas { display: block; width: 100%; height: 100%; outline: 0; }
.model-loading {
  position: absolute;
  z-index: 3;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: opacity 300ms ease;
}
.model-loading span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--coral);
  animation: loadingPulse 1s ease-in-out infinite;
}
.model-loading span:nth-child(2) { animation-delay: .13s; }
.model-loading span:nth-child(3) { animation-delay: .26s; }
.model-view.is-loaded .model-loading { opacity: 0; pointer-events: none; }
@keyframes loadingPulse {
  0%,100% { opacity: .25; transform: translateY(0); }
  50% { opacity: .8; transform: translateY(-4px); }
}

.topbar {
  position: absolute;
  z-index: 6;
  top: max(24px, env(safe-area-inset-top));
  left: clamp(24px, 4.2vw, 68px);
  right: clamp(24px, 4.2vw, 68px);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  pointer-events: none;
}
.brand-lockup { display: grid; gap: 5px; }
.brand-name {
  font-size: 14px;
  line-height: 1;
  font-weight: 750;
  letter-spacing: .21em;
}
.brand-subtitle, .telemetry-label, .telemetry-value, .eyebrow, .slide-counter, .micro-label {
  font-family: var(--mono-font);
  text-transform: uppercase;
}
.brand-subtitle { color: var(--muted); font-size: 9px; letter-spacing: .12em; }
.topbar-meta { display: flex; align-items: flex-start; gap: clamp(15px,2.5vw,38px); }
.telemetry { display: grid; gap: 5px; min-width: 66px; text-align: right; }
.telemetry-label { color: var(--faint); font-size: 9px; letter-spacing: .12em; }
.telemetry-value { color: var(--ink); font-size: 11px; letter-spacing: .035em; }
.slide-counter {
  white-space: nowrap;
  flex-shrink: 0;
  align-self: flex-start;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 3px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .11em;
}

/* The content pane is deliberately wide and bounded by the fixed viewport chrome. */
.glass-panel {
  touch-action: pinch-zoom;
  position: absolute;
  z-index: 5;
  top: clamp(94px, 14vh, 145px);
  bottom: clamp(92px, 13vh, 128px);
  left: clamp(24px, 4.2vw, 76px);
  display: flex;
  width: min(55vw, 760px);
  min-height: 0;
  overflow: clip;
  border: 1px solid rgba(255,220,210,.14);
  border-radius: 15px;
  background: linear-gradient(135deg, rgba(57,25,42,.92), rgba(40,16,30,.86));
  box-shadow: 0 22px 70px rgba(12,4,9,.22), inset 0 1px rgba(255,255,255,.055);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  transition: opacity 350ms ease;
}
.glass-panel::before {
  position: absolute;
  z-index: 0;
  inset: 9px;
  border: 1px solid rgba(255,220,210,.045);
  border-radius: 9px;
  content: "";
  pointer-events: none;
}
#slide-content {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  padding: clamp(22px, 2.7vw, 42px);
  overflow: clip;
}
.slide-copy {
  width: 100%;
  max-width: none;
  --f: var(--fit-scale, 1);
}
.slide-enter { animation: textRise 560ms var(--ease) both; }
@keyframes textRise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 calc(15px * var(--f));
  color: var(--coral);
  font-size: calc(10px * var(--f));
  line-height: 1.35;
  letter-spacing: .15em;
}
.eyebrow::before { width: 22px; height: 1px; flex: 0 0 auto; background: var(--coral); content: ""; }
.slide-title {
  margin: 0;
  color: var(--ink);
  font-size: clamp(26px, 3vw, 46px);
  font-size: calc(clamp(26px, 3vw, 46px) * var(--f));
  line-height: 1.02;
  font-weight: 600;
  letter-spacing: -.045em;
  text-wrap: balance;
}
.slide-sub {
  margin: calc(10px * var(--f)) 0 0;
  color: #F1B9B2;
  font-size: calc(clamp(14px, 1.35vw, 19px) * var(--f));
  line-height: 1.34;
  font-weight: 500;
}
.slide-body {
  margin: calc(14px * var(--f)) 0 0;
  color: var(--muted);
  font-size: calc(clamp(12px, .98vw, 14px) * var(--f));
  line-height: 1.48;
}
.slide-bullets {
  display: grid;
  gap: calc(8px * var(--f));
  margin: calc(16px * var(--f)) 0 0;
  padding: 0;
  list-style: none;
}
.slide-bullets li {
  position: relative;
  padding-left: calc(18px * var(--f));
  color: #F2E3DF;
  font-size: calc(clamp(11px, .91vw, 13px) * var(--f));
  line-height: 1.43;
}
.slide-bullets li::before {
  position: absolute;
  top: .58em;
  left: 0;
  width: calc(6px * var(--f));
  height: calc(6px * var(--f));
  border-radius: 50%;
  background: var(--rose);
  content: "";
}
.slide-stat {
  display: flex;
  align-items: baseline;
  gap: calc(8px * var(--f));
  margin-top: calc(17px * var(--f));
  padding-top: calc(12px * var(--f));
  border-top: 1px solid var(--line);
}
.stat-value {
  color: var(--coral);
  font-size: calc(clamp(29px, 3.6vw, 48px) * var(--f));
  font-weight: 600;
  letter-spacing: -.06em;
}
.stat-unit { color: var(--salmon); font-family: var(--mono-font); font-size: calc(12px * var(--f)); }
.stat-label { color: var(--muted); font-size: calc(11px * var(--f)); line-height: 1.4; }
.slide-chips, .slide-links {
  display: flex;
  flex-wrap: wrap;
  gap: calc(7px * var(--f));
  margin-top: calc(15px * var(--f));
}
.slide-chip {
  padding: calc(5px * var(--f)) calc(8px * var(--f));
  border: 1px solid rgba(255,126,107,.28);
  border-radius: 2px;
  color: #F5C9C0;
  font: calc(9px * var(--f))/1.35 var(--mono-font);
  letter-spacing: .045em;
}
.slide-note {
  margin: calc(16px * var(--f)) 0 0;
  padding-left: calc(12px * var(--f));
  border-left: 2px solid var(--wine);
  color: #D6BBC2;
  font-size: calc(clamp(10px, .8vw, 11px) * var(--f));
  line-height: 1.45;
}
.slide-legend { display: grid; gap: calc(6px * var(--f)); margin: calc(14px * var(--f)) 0 0; padding: 0; list-style: none; }
.slide-legend li { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: calc(11px * var(--f)); }
.legend-swatch { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: var(--coral); }
.slide-media {
  display: block;
  width: 100%;
  max-height: 150px;
  margin-top: calc(14px * var(--f));
  object-fit: cover;
  border: 1px solid var(--line);
  border-radius: 5px;
}
.slide-team {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: clamp(16px, 2.6vw, 34px);
  row-gap: calc(9px * var(--f));
  margin: calc(15px * var(--f)) 0 0;
  padding: 0;
  list-style: none;
}
.slide-team li { display: grid; min-width: 0; gap: calc(2px * var(--f)); }
.team-name { color: var(--ink); font-size: calc(12px * var(--f)); font-weight: 600; }
.team-role { color: var(--faint); font: calc(9px * var(--f))/1.42 var(--mono-font); letter-spacing: .025em; }
.slide-link {
  display: inline-flex;
  align-items: center;
  min-height: calc(32px * var(--f));
  padding: 0 calc(10px * var(--f));
  border: 1px solid rgba(255,126,107,.36);
  border-radius: 3px;
  color: var(--coral);
  font-size: calc(11px * var(--f));
  text-decoration: none;
}
.slide-link:hover { background: rgba(255,126,107,.1); }
.slide-link:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; }

/* Content layouts are composed by narrative type; the card geometry carries
   meaning while every configured sentence remains visible as supplied. */
.slide-copy[class*="slide-layout--"] { position: relative; }
.slide-copy[class*="slide-layout--"] .slide-title { max-width: 18ch; }
.content-composition { display: grid; gap: calc(14px * var(--f)); }
.slide-layout--problem .problem-composition {
  grid-template-columns: minmax(150px, .78fr) minmax(0, 1.22fr);
  align-items: stretch;
  margin-top: calc(14px * var(--f));
}
.problem-composition .story-intro {
  display: flex;
  align-items: center;
  margin: 0;
  padding: calc(17px * var(--f));
  border-left: 2px solid var(--coral);
  border-radius: 0 9px 9px 0;
  background: linear-gradient(115deg, rgba(255,126,107,.12), rgba(255,126,107,.025));
  font-size: calc(clamp(12px, .98vw, 14px) * var(--f));
  line-height: 1.55;
}
.question-grid { min-width: 0; }
.slide-bullets.card-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: calc(7px * var(--f));
  margin: 0;
}
.card-list li, .impact-list li, .feature-grid li, .market-grid li,
.business-grid li, .collaboration-grid li {
  min-width: 0;
  padding: calc(10px * var(--f)) calc(12px * var(--f));
  border: 1px solid rgba(255,220,210,.13);
  border-radius: 7px;
  background: rgba(255,237,231,.035);
  line-height: 1.4;
}
.card-list li { padding-left: calc(31px * var(--f)); }
.card-list li::before {
  top: calc(10px * var(--f));
  left: calc(12px * var(--f));
  width: calc(7px * var(--f));
  height: calc(7px * var(--f));
  border-radius: 2px;
  transform: rotate(45deg);
}
.slide-layout--problem .slide-note { margin-top: calc(13px * var(--f)); }

.slide-layout--impact .impact-intro,
.slide-layout--solution .solution-intro,
.slide-layout--market-competitors .market-intro,
.slide-layout--business-model .business-intro,
.slide-layout--potential-collaboration .collaboration-intro,
.slide-layout--team .team-intro {
  max-width: 57ch;
  margin-top: calc(11px * var(--f));
}
.impact-composition { margin-top: calc(14px * var(--f)); }
.slide-bullets.impact-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: calc(8px * var(--f));
  margin: 0;
}
.impact-list li {
  display: flex;
  align-items: flex-start;
  min-height: calc(84px * var(--f));
  padding-top: calc(14px * var(--f));
  color: #F4E3DF;
  font-size: calc(clamp(10px, .86vw, 12px) * var(--f));
}
.impact-list li::before {
  top: calc(14px * var(--f));
  width: calc(5px * var(--f));
  height: calc(20px * var(--f));
  border-radius: 4px;
}
.slide-layout--impact .slide-note { margin-top: calc(13px * var(--f)); }

.solution-composition { margin-top: calc(14px * var(--f)); }
.slide-bullets.feature-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: calc(8px * var(--f));
  margin: 0;
}
.feature-grid li {
  min-height: calc(100px * var(--f));
  padding: calc(13px * var(--f));
  border-top: 2px solid rgba(255,126,107,.68);
  color: #F5E8E4;
  font-size: calc(clamp(10px, .86vw, 12px) * var(--f));
}
.feature-grid li::before { display: none; }
.slide-layout--solution .slide-note { margin-top: calc(12px * var(--f)); }

.slide-layout--market-competitors .market-intro,
.slide-layout--business-model .business-intro,
.slide-layout--potential-collaboration .collaboration-intro {
  padding-left: calc(13px * var(--f));
  border-left: 1px solid rgba(255,126,107,.55);
}
.market-composition { margin-top: calc(13px * var(--f)); }
.slide-bullets.market-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: calc(8px * var(--f));
  margin: 0;
  counter-reset: market;
}
.market-grid li {
  min-height: calc(82px * var(--f));
  padding: calc(12px * var(--f));
  color: #F4E5E1;
  font-size: calc(clamp(10px, .84vw, 12px) * var(--f));
}
.market-grid li::before {
  position: static;
  display: block;
  width: calc(17px * var(--f));
  height: calc(2px * var(--f));
  margin-bottom: calc(10px * var(--f));
  border-radius: 0;
  background: var(--coral);
}
.slide-layout--market-competitors .slide-note { margin-top: calc(12px * var(--f)); }

.business-composition { margin-top: calc(14px * var(--f)); }
.slide-bullets.business-grid {
  display: grid;
  grid-template-columns: 1.15fr 1fr 1fr;
  gap: calc(8px * var(--f));
  margin: 0;
}
.business-grid li {
  min-height: calc(86px * var(--f));
  padding: calc(12px * var(--f));
  color: #F5E6E1;
  font-size: calc(clamp(10px, .84vw, 12px) * var(--f));
}
.business-grid li:first-child {
  border-color: rgba(255,126,107,.35);
  background: rgba(255,126,107,.09);
}
.business-grid li::before { display: none; }
.slide-layout--business-model .slide-note { margin-top: calc(12px * var(--f)); }

.collaboration-composition { margin-top: calc(13px * var(--f)); }
.slide-bullets.collaboration-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: calc(8px * var(--f));
  margin: 0;
}
.collaboration-grid li {
  min-height: calc(100px * var(--f));
  padding: calc(12px * var(--f));
  color: #F3E4DF;
  font-size: calc(clamp(10px, .84vw, 12px) * var(--f));
}
.collaboration-grid li::before {
  top: calc(12px * var(--f));
  left: calc(12px * var(--f));
  width: calc(18px * var(--f));
  height: 1px;
  border-radius: 0;
}
.collaboration-grid li { padding-top: calc(23px * var(--f)); }
.slide-layout--potential-collaboration .slide-note { margin-top: calc(12px * var(--f)); }

.slide-layout--team .team-intro { margin-bottom: calc(8px * var(--f)); }
.team-composition .slide-team {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: calc(10px * var(--f));
  margin-top: calc(12px * var(--f));
}
.team-composition .slide-team li {
  min-height: calc(57px * var(--f));
  align-content: center;
  padding: calc(9px * var(--f)) calc(11px * var(--f));
  border-left: 1px solid rgba(255,126,107,.55);
  background: linear-gradient(90deg, rgba(255,126,107,.075), transparent);
}
.team-composition .team-name { font-size: calc(12px * var(--f)); }
.team-composition .team-role { font-size: calc(9px * var(--f)); }

.slide-layout--the-ask .ask-composition {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(180px, .78fr);
  align-items: center;
  gap: calc(20px * var(--f));
  margin-top: calc(26px * var(--f));
}
.ask-intro {
  max-width: 32ch;
  margin: 0;
  color: var(--muted);
  font-size: calc(clamp(13px, 1.12vw, 16px) * var(--f));
  line-height: 1.55;
}
.ask-composition .slide-stat {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: end;
  gap: 0 calc(9px * var(--f));
  margin: 0;
  padding: calc(18px * var(--f)) calc(16px * var(--f));
  border: 1px solid rgba(255,126,107,.35);
  border-radius: 9px;
  background: linear-gradient(145deg, rgba(255,126,107,.12), rgba(125,29,52,.08));
}
.ask-composition .stat-value { grid-row: span 2; font-size: calc(clamp(36px, 4vw, 56px) * var(--f)); }
.ask-composition .stat-unit { align-self: end; padding-bottom: calc(5px * var(--f)); }
.ask-composition .stat-label { grid-column: 1 / -1; padding-top: calc(8px * var(--f)); }

/* Semantic list items retain their source string as adjacent text spans.
   These visual treatments distinguish the relationships within each phrase. */
.content-item {
  position: relative;
  list-style: none;
  color: #F4E6E1;
}
.content-item::before { display: none !important; }
.content-item-copy { min-width: 0; }
.impact-list .content-item-copy,
.feature-grid .content-item-copy,
.business-grid .content-item-copy,
.collaboration-grid .content-item-copy { grid-column: 2; }
.content-item-heading {
  display: block;
  color: #FFD0C5;
  font-size: calc(10px * var(--f));
  font-weight: 700;
  letter-spacing: .025em;
  line-height: 1.35;
}
.content-item-detail {

  if (event.key.toLowerCase() === "f") {
    event.preventDefault();
    fullscreenButton.click();
  } else if (event.key.toLowerCase() === "h") {
    event.preventDefault();

    stepStage(-1);
  } else if (event.key === "Home") {
    event.preventDefault();
    seekTo(0, "chapter");
  } else if (event.key === "End") {
    event.preventDefault();
    seekTo(duration, "chapter");
  } else if (event.code === "Space" && !target?.closest?.("button")) {
    event.preventDefault();
    stepStage(event.shiftKey ? -1 : 1);

  const center = bounds.getCenter(new THREE.Vector3());

function updateCameraFit() {
  const width = Math.max(1, viewport.clientWidth);
  const height = Math.max(1, viewport.clientHeight);
  const aspect = width / height;
  const viewHeight = 4;
  const viewWidth = viewHeight * aspect;
  const layout = getComputedStyle(presentation);
  sceneCenterX = Number.parseFloat(layout.getPropertyValue("--scene-center-x")) || .73;
  sceneCenterY = Number.parseFloat(layout.getPropertyValue("--scene-center-y")) || .48;
  sceneHeight = Number.parseFloat(layout.getPropertyValue("--scene-height")) || .7;
  camera.left = -viewWidth / 2;
  camera.right = viewWidth / 2;
  camera.top = viewHeight / 2;
  camera.bottom = -viewHeight / 2;
  camera.setViewOffset(width, height, width * (.5 - sceneCenterX), height * (.5 - sceneCenterY), width, height);
  camera.updateProjectionMatrix();
  renderer.setSize(width, height, false);
  fitSlideContent();
  if (hasLoadedModel && !flight && !userInteracting) flyToStage(currentStage, true);
}
const resizeObserver = new ResizeObserver(updateCameraFit);
resizeObserver.observe(viewport);
window.addEventListener("resize", updateCameraFit, { passive: true });
document.fonts?.ready.then(() => { fitSlideContent(); updateCameraFit(); });
updateTimelineControls();
setMotionEnabled(motionEnabled);

function animate(timestamp) {
  frameId = requestAnimationFrame(animate);
  const delta = previousFrame ? Math.min((timestamp - previousFrame) / 1000, 1) : 0;
  previousFrame = timestamp;
  // The scene clock NEVER changes timelineTime or currentStage.

      zoom: camera.zoom,
      direction: camera.position.clone().sub(controls.target)
    };
    motionSeconds = 0;
    inspectionLocked = false;
  }
  updateFlight(delta);
  updateAmbientCamera(delta);
  if (hasLoadedModel && motionEnabled && !userInteracting && !inspectionLocked) {
    const start = SLIDES[currentStage].cancerTime;
    const end = SLIDES[currentStage + 1]?.cancerTime ?? start;
    const fraction = .5 - .5 * Math.cos(motionSeconds * .22);
    updateCancerVisual(start + (end - start) * fraction);
    modelPivot.rotation.y += THREE.MathUtils.degToRad(SLIDES[currentStage].spin || 0) * delta;
  }
  controls.update();
  updateFocusLabels();
  updateCameraDataset();
  renderer.render(scene, camera);
}
animate();
window.addEventListener("pagehide", () => {
  cancelAnimationFrame(frameId);
  resizeObserver.disconnect();
  controls.dispose();
  renderer.dispose();
});

</script>
